name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The whole solution, so the tray app and CLI are compiled (with analyzers, warnings as errors),
      # not only what the tests reference.
      - run: dotnet build Clipstems.slnx --configuration Release
      - run: dotnet test Clipstems.slnx --configuration Release --no-build

  # Builds the installer on every change, so packaging breaks show up in the PR that breaks them.
  # The Setup.exe is kept as a workflow artifact for a week, for trying a change before release.
  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: build/.cache
          key: package-${{ hashFiles('build/ffmpeg.json', 'src/Clipstems.App/Clipstems.App.csproj') }}
      - run: ./build/package.ps1 -Version 0.0.0-ci.${{ github.run_number }}
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: Clipstems-Setup-ci.${{ github.run_number }}
          path: artifacts/Releases/*-Setup.exe
          retention-days: 7
          if-no-files-found: error
