name: release

# Builds the installer and publishes it as a GitHub release, two ways:
# - Actions > release > Run workflow, with a version (e.g. 0.3.0): builds main and creates the
#   v<version> tag and release on that exact commit.
# - Pushing a tag like v0.3.0 from a checkout.
# Installed copies of Clipstems pick the release up within a few hours. See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.3.0, or 0.3.1-beta.1 for a pre-release)'
        required: true
        type: string

permissions:
  contents: write # create the tag and release, and upload its files

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A manual release always comes from main, never from a feature branch.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: build/.cache
          key: package-${{ hashFiles('build/ffmpeg.json', 'src/Clipstems.App/Clipstems.App.csproj') }}
      - run: dotnet build Clipstems.slnx --configuration Release
      - run: dotnet test Clipstems.slnx --configuration Release --no-build
      - name: Package and publish
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION.Trim().TrimStart('v') } else { $env:TAG.TrimStart('v') }
          ./build/package.ps1 -Version $version -DownloadPrevious -Publish -TargetCommitish $env:COMMIT
